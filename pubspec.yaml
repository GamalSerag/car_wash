name: car_wash
description: Arabic RTL car wash sales application.
publish_to: 'none'
version: 1.0.10+12

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.8
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  internet_connection_checker_plus: ^3.1.2
  package_info_plus: ^10.2.2
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.5
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#003B46"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_foreground_inset: 12

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
